name: "📝 Docs"
description: 문서 수정
title: "[Docs] "
labels: ["Docs"]
body:
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: 어떤 문서를 수정하는지 한두 줄로 요약해 주세요.
      placeholder: README에 Git 컨벤션을 추가합니다.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 수정할 문서와 추가·변경할 내용을 적어 주세요.
      placeholder: |
        - 대상: README.md
        - 내용: 브랜치/커밋/PR 규칙 섹션 추가
  - type: textarea
    id: todo
    attributes:
      label: To do
      description: 해야 할 일을 체크리스트로 적어 주세요.
      value: |
        - [ ]
        - [ ]
